
version: 0.2

phases:
  install:
    commands:
      - echo "Checking AWS CLI version"
      - aws --version

  pre_build:
    commands:
      - echo "Validating CloudFormation templates"
      - aws cloudformation validate-template --template-body file://infrastructure/network.yaml
      - aws cloudformation validate-template --template-body file://infrastructure/ec2.yaml

  build:
    commands:
      - echo "CloudFormation templates validated successfully"

artifacts:
  files:
    - infrastructure/network.yaml
    - infrastructure/ec2.yaml
